<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FormEncoder</title>
  <style>
    html { height: 100%; background: transparent; }
    body { margin: 0; height: 100%; box-sizing: border-box; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 16px; overflow: hidden; color: #a8a8b8; font: 13px -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(50vh - 64px); gap: 18px; }
    img { display: block; user-select: none; }
    p { margin: 0; height: 16px; line-height: 16px; letter-spacing: 0.2px; }
    .bar { width: 180px; height: 3px; border-radius: 2px; background: #1f1f26; overflow: hidden; }
    .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #a4a4a4; animation: run 1.1s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body><img src="favicon.png" width="72" height="72" alt="formencoder" draggable="false"><p>Starting the formencoder engine</p><div class="bar" role="progressbar" aria-label="Starting the formencoder engine"><i></i></div></body>
</html>
