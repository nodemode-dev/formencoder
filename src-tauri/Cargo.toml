[package]
name = "formencoder"
version = "0.5.2"
description = "formencoder desktop shell"
authors = ["nodemode-ai"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
regex = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = false

# Cargo strips build scripts and procedural macros with the rest, and on macOS 27
# with rustc 1.97.1 a stripped procedural macro cannot be loaded ("can't find
# crate"). Build-time crates stay unstripped, and so does the shell binary, since
# macOS builds fail on a stripped one.
[profile.release.build-override]
strip = false
