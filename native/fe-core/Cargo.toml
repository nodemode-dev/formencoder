[package]
name = "fe-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "formencoder's own encoding engine: the queue, presets, export settings, the FFmpeg graph builder, the parallel runner and watch folders, exposed to the formencoder engine service as a Python extension"
publish = false

[lib]
name = "fe_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
ab_glyph = "0.2.32"
png = "0.18"
md-5 = "0.10"
sha1 = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_LibraryLoader"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
