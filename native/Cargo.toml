[workspace]
resolver = "3"
members = [
    "fencoder-core",
    "fencoder-io",
    "fencoder-plan",
    "fencoder-run",
    "fencoder-engine",
    "fencoder-commands",
    "fencoder-py",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
fencoder-core = { path = "fencoder-core" }
fencoder-io = { path = "fencoder-io" }
fencoder-plan = { path = "fencoder-plan" }
fencoder-run = { path = "fencoder-run" }
fencoder-engine = { path = "fencoder-engine" }
fencoder-commands = { path = "fencoder-commands" }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
ab_glyph = "0.2.32"
png = "0.18"
md-5 = "0.10"
sha1 = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_LibraryLoader"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
# fe_core is a library Python loads with dlopen, and on macOS 27 with rustc 1.97.1
# a stripped one is refused ("mis-aligned LINKEDIT string pool"), as formcut found
# for its own native library. It stays unstripped; the size is nothing beside FFmpeg.
strip = false

# Even with no strip setting, cargo strips build scripts and procedural macros in
# release builds (-C strip=debuginfo), and on the same toolchain a stripped
# procedural macro cannot be loaded (pyo3_macros, indoc), so they stay unstripped.
[profile.release.build-override]
strip = false
