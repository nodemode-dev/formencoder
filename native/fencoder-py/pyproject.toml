[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "fe-core"
version = "0.4.8"
description = "formencoder's own encoding engine for the formencoder engine service"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[tool.maturin]
bindings = "pyo3"
module-name = "fe_core"
features = ["python"]
